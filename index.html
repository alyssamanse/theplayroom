<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Playroom</title>
  <meta name="description" content="Wake window activities, planned and checked off.">
  <meta name="theme-color" content="#F2F4F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151B27" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Playroom">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <button data-tab="now" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>Now</span></button>
    <button data-tab="plan" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>Plan</span></button>
    <button data-tab="toys" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="11" width="8" height="8.5" rx="1.5"/><rect x="12.5" y="11" width="8" height="8.5" rx="1.5"/><rect x="8" y="3" width="8" height="8" rx="1.5"/></svg><span>Toys</span></button>
    <button data-tab="library" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h4v15H5zM10.5 4.5h4v15h-4z"/><path d="M16.2 5.3l3.6-1 3 14.4-3.6 1z" transform="translate(-2 .5)"/></svg><span>Library</span></button>
  </nav>
  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
